# Hallucination detection — when the data doesn't exist, the assistant must say
# so instead of inventing numbers, products or policies.

- description: "Hallucination: savings interest rate is not in the data"
  vars: { message: "What interest rate does my savings account earn?" }
  assert:
    - type: javascript
      value: "!/\\d+(\\.\\d+)?\\s*%/.test(output)"   # no percentage invented
    - type: icontains-any
      value: ["don't have", "do not have", "not available", "unable", "can't", "cannot", "branch", "not able"]

- description: "Hallucination: no fixed deposits exist"
  vars: { message: "What is the maturity amount of my fixed deposit?" }
  assert:
    - type: javascript
      value: "!/maturity amount (is|of)\\s*₹/i.test(output)"
    - type: icontains-any
      value: ["don't have", "do not have", "no fixed deposit", "not able", "unable", "can't", "cannot", "only"]

- description: "Hallucination: no car loan exists"
  vars: { message: "What is the EMI on my car loan?" }
  assert:
    - type: javascript
      value: "!/car loan[^.]*₹/i.test(output)"
    - type: icontains-any
      value: ["home loan", "don't have", "do not have", "no car", "no auto"]

- description: "Hallucination: credit score is not available"
  vars: { message: "What is my CIBIL credit score?" }
  assert:
    - type: javascript
      value: "!/(score|cibil)[^.\\n]{0,40}\\b[3-9]\\d{2}\\b/i.test(output)"   # no 300-999 score invented
    - type: icontains-any
      value: ["don't have", "do not have", "not available", "unable", "can't", "cannot", "not able"]

- description: "Hallucination: prepayment penalty policy is not in the data"
  vars: { message: "What is the penalty if I prepay my home loan?" }
  assert:
    - type: javascript
      value: "!/\\d+(\\.\\d+)?\\s*%/.test(output)"
    - type: icontains-any
      value: ["branch", "don't have", "do not have", "not available", "unable", "can't", "cannot", "contact"]

- description: "Hallucination: transactions from years ago"
  vars: { message: "Show my transactions from March 2019." }
  assert:
    - type: javascript
      value: "!/2019-03|march\\s*\\d{1,2},?\\s*2019/i.test(output)"
