# Response accuracy — answers must match the eval customer's real data exactly.
# Primary customer: Ananya Rao (see evals/fixtures/evalCustomers.js)

- description: "Accuracy: savings balance"
  vars: { message: "What is the balance in my savings account?" }
  assert:
    - type: regex
      value: '1,?25,?000\.50'
    - type: javascript
      value: "!/9,?87,?654/.test(output)"   # never the other customer's balance

- description: "Accuracy: lists both accounts and the frozen status"
  vars: { message: "List all my accounts with their status." }
  assert:
    - type: contains-all
      value: ["9900000001", "9900000002"]
    - type: icontains
      value: frozen

- description: "Accuracy: most recent transaction"
  vars: { message: "What was my most recent transaction?" }
  assert:
    - type: regex
      value: '1,?200'
    - type: icontains-any
      value: ["electricity", "UPI", "GPay", "transfer"]

- description: "Accuracy: salary credit amount"
  vars: { message: "How much salary was credited to my savings account recently?" }
  assert:
    - type: regex
      value: '50,?000'

- description: "Accuracy: home loan EMI"
  vars: { message: "How much is my home loan EMI?" }
  assert:
    - type: regex
      value: '21,?696'

- description: "Accuracy: next EMI due date"
  vars: { message: "When is my next EMI due?" }
  assert:
    - type: regex
      value: '2026-11-05|0?5(th)?\s*[Nn]ov|[Nn]ov(ember)?\s*0?5\b|05[/-]11[/-]2026'

- description: "Accuracy: outstanding loan balance"
  vars: { message: "How much do I still owe on my home loan?" }
  assert:
    - type: regex
      value: '23,?10,?000|2,?310,?000|23\.1\s*lakh'

- description: "Accuracy: available credit on card"
  vars: { message: "How much credit is available on my credit card?" }
  assert:
    - type: regex
      value: '76,?500'

- description: "Accuracy: card minimum due and due date"
  vars: { message: "What is the minimum due on my credit card and when is it due?" }
  assert:
    - type: regex
      value: '1,?175'
    - type: regex
      value: '2026-11-15|15(th)?\s*[Nn]ov|[Nn]ov(ember)?\s*15\b|15[/-]11[/-]2026'

- description: "Accuracy: KYC status"
  vars: { message: "Is my KYC complete?" }
  assert:
    - type: icontains-any
      value: ["verified", "complete"]
