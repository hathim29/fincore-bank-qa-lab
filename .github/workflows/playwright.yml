name: FinCore Bank — Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  playwright:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout code ──────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node.js ─────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # ── 3. Install dependencies ───────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Install Playwright browsers ────────────────────────
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # ── 5. Create .env file from GitHub secret ────────────────
      - name: Create .env file
        run: echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env

      # ── 6. Force IPv4 for Supabase connection ─────────────────
      - name: Force IPv4 DNS resolution
        run: |
          SUPABASE_HOST="db.wltinzairppaukwafqja.supabase.co"
          IPV4=$(getent ahostsv4 $SUPABASE_HOST | head -1 | awk '{print $1}')
          echo "Resolved $SUPABASE_HOST to IPv4: $IPV4"
          echo "$IPV4 $SUPABASE_HOST" | sudo tee -a /etc/hosts

      # ── 7. Seed the database ──────────────────────────────────
      - name: Seed database
        run: node db/seed.js

      # ── 8. Run Playwright tests ───────────────────────────────
      - name: Run Playwright tests
        run: npx playwright test --reporter=list
        env:
          CI: true

      # ── 9. Upload HTML report — always runs ───────────────────
      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
